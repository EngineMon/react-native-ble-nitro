buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.12.1"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: 'org.jetbrains.kotlin.android'
apply from: '../nitrogen/generated/android/BleNitro+autolinking.gradle'
apply from: "./fix-prefab.gradle"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["BleNitro_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["BleNitro_" + name]).toInteger()
}

android {
  namespace "com.margelo.nitro.co.zyke.ble"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
            "META-INF",
            "META-INF/**",
            "**/libc++_shared.so",
            "**/libfbjni.so",
            "**/libjsi.so",
            "**/libfolly_json.so",
            "**/libfolly_runtime.so",
            "**/libglog.so",
            "**/libhermes.so",
            "**/libhermes-executor-debug.so",
            "**/libhermes_executor.so",
            "**/libreactnative.so",
            "**/libreactnativejni.so",
            "**/libturbomodulejsijni.so",
            "**/libreact_nativemodule_core.so",
            "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig true
    prefab true
    // Publishes libBleNitro.so with the generated C++ spec headers as the prefab
    // package "react-native-ble-nitro" (module "BleNitro"), so another native
    // library can find_package(react-native-ble-nitro REQUIRED CONFIG), link
    // react-native-ble-nitro::BleNitro and use the HybridObject from C++
    // (dynamic_pointer_cast to HybridNativeBleNitroSpec needs its typeinfo,
    // which lives in libBleNitro.so). fix-prefab.gradle orders the native build
    // before the prefab packaging.
    prefabPublishing true
  }

  prefab {
    BleNitro {
      headers "${project.buildDir}/headers/blenitro/"
    }
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  testOptions {
    unitTests.returnDefaultValues = true
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          // React Codegen files
          "${project.buildDir}/generated/source/codegen/java"
        ]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}


dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // Add a dependency on NitroModules
  implementation project(":react-native-nitro-modules")

  testImplementation "junit:junit:4.13.2"
}

// The headers of the prefab module: nitrogen's shared C++ headers
// (HybridNativeBleNitroSpec.hpp, the structs and enums), under BleNitro/ so
// consumers include them as <BleNitro/HybridNativeBleNitroSpec.hpp>, the form
// the BleNitro pod's public headers also take on iOS.
tasks.register('prepareHeaders', Copy) {
  from fileTree('../nitrogen/generated/shared/c++').filter { it.isFile() }
  include "*.hpp"
  into "${project.buildDir}/headers/blenitro/BleNitro/"
  includeEmptyDirs = false
}

preBuild.dependsOn(prepareHeaders)

// nitrogen 0.35 marks the JNI method behind every generated callback class
// (Func_*.kt, invoke_cxx) @FastNative. That method runs the callback's C++
// code, and the garbage collector cannot suspend a thread inside a @FastNative
// method (Android's dalvik.annotation.optimization.FastNative documentation):
// a C++ callback blocked on a lock whose holder calls into Java during a
// collection stalls the collector's suspend-all, and the app hangs.
// scripts/strip-fast-native.mjs removes the annotation after every nitrogen run
// (npm run nitro-codegen runs both); this check keeps bindings generated
// without that step from being compiled. It covers only this library's
// generated bindings.
//
// It applies the script's own rule: a generated Kotlin file must not mention
// FastNative at all, so the fully qualified
// @dalvik.annotation.optimization.FastNative form fails too. The generated
// directory is its input and a stamp file its output, so Gradle skips it while
// the generated files are unchanged since the last passing check.
def generatedAndroidBindings = file("../nitrogen/generated/android")
def checkGeneratedBindings = tasks.register("checkGeneratedBindingsHaveNoFastNative") {
  group = "verification"
  description = "Fails when the Kotlin bindings nitrogen generated for this library mention FastNative."
  inputs.dir(generatedAndroidBindings).withPropertyName("generatedAndroidBindings").optional()
  def stamp = file("${project.buildDir}/checkGeneratedBindingsHaveNoFastNative.stamp")
  outputs.file(stamp).withPropertyName("stamp")
  doLast {
    if (!generatedAndroidBindings.isDirectory()) {
      throw new GradleException(
        "react-native-ble-nitro: ${generatedAndroidBindings} doesn't exist. " +
        "Run `npm run nitro-codegen` in react-native-ble-nitro (nitrogen, then " +
        "scripts/strip-fast-native.mjs), then build again."
      )
    }
    def offenders = []
    generatedAndroidBindings.eachFileRecurse(groovy.io.FileType.FILES) { file ->
      if (file.name.endsWith(".kt") && file.text.contains("FastNative")) {
        offenders << file
      }
    }
    if (!offenders.isEmpty()) {
      throw new GradleException(
        "react-native-ble-nitro: the generated Nitro bindings still mention FastNative, " +
        "which can hang the app (scripts/strip-fast-native.mjs explains why):\n" +
        offenders.collect { "  ${it}" }.join("\n") + "\n" +
        "Run `node scripts/strip-fast-native.mjs` in react-native-ble-nitro " +
        "(`npm run nitro-codegen` runs it after nitrogen), then build again."
      )
    }
    stamp.parentFile.mkdirs()
    stamp.text = "passed\n"
  }
}

// Before every Kotlin compilation of this module (the library and its unit tests).
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  dependsOn(checkGeneratedBindings)
}
